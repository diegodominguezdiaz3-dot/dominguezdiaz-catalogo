name: Actualizar catálogo de subastas
on:
  schedule:
    - cron: '17 6 * * *'   # todos los días a las 07:17 (hora de Madrid en invierno)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: catalogo
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python actualizar.py
      - name: Guardar y publicar
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add catalogo.json estado.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Catálogo actualizado $(date +%d/%m/%Y)"
          git push
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/catalogo.json" || true
